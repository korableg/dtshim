[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
dtshim-core = { path = "crates/core" }

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Titov Dmitry <https://titovde.ru> <titov-de@yandex.ru>"]

[profile.release]
strip = "symbols"
