[package]
name = "daemon"
edition.workspace = true
version.workspace = true
authors.workspace = true

[[bin]]
name = "dtshimd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize", "garde"] }
garde = { version = "0.23", default-features = false, features = ["derive", "regex"] }
regex = "1"


dtshim-core.workspace = true
tempfile = "3"
futures = "0.3.34"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
