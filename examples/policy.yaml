commands:
  jq:
    executable: /usr/bin/jq
    env:
      allow: []
    allow: null
  git:
    executable: /usr/bin/git
    env:
      host: [HOME, SSH_AUTH_SOCK, {LANG: "C.UTF-8"}, {GIT_CONFIG_NOSYSTEM: "1"}]
      allow: [HOME, SSH_AUTH_SOCK, LANG, GIT_CONFIG_NOSYSTEM, PATH]
    allow:
      - prefix: [status]
        options:
          - names: [--short, -s]
          - names: [--branch, -b]
      - prefix: [log]
        options:
          - names: [--oneline]
          - names: [--max-count, -n]
            value: '[1-9][0-9]?'
            required: true
          - names: [--grep]
            value: '[^\x00\r\n]+'
            repeat: true
        positionals:
          - '[A-Za-z0-9][A-Za-z0-9._/-]*'
