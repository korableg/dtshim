name: Test and publish builds

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run unit tests
        run: cargo test --locked --workspace --lib --bins

      - name: Run integration tests
        run: |
          cargo build --locked --workspace --bins
          cargo test --locked -p integration

  build:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'push'
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive-platform: linux-x86_64
            image-arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive-platform: linux-arm64
            image-arch: arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            archive-platform: macos-arm64
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE_PLATFORM: ${{ matrix.archive-platform }}
      IMAGE_ARCH: ${{ matrix.image-arch }}
      DTSHIM_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('latest-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable

      - name: Build release binaries
        env:
          RUSTFLAGS: ${{ runner.os == 'Linux' && '-C target-feature=+crt-static -C linker=musl-gcc' || '' }}
        run: cargo build --locked --release --workspace --bins --target "$TARGET"

      - name: Create archive
        id: archive
        run: |
          archive_version="${DTSHIM_VERSION//[^a-zA-Z0-9._+-]/-}"
          archive_name="dtshim-$archive_version-$ARCHIVE_PLATFORM.tar.gz"
          mkdir -p dist
          tar -czf "dist/$archive_name" -C "target/$TARGET/release" dtshim dtshimd
          printf 'name=%s\n' "$archive_name" >> "$GITHUB_OUTPUT"

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: dist/${{ steps.archive.outputs.name }}
          archive: false
          if-no-files-found: error

      - name: Prepare image client
        if: runner.os == 'Linux'
        run: |
          mkdir -p "image/$IMAGE_ARCH"
          cp "target/$TARGET/release/dtshim" "image/$IMAGE_ARCH/dtshim"

      - name: Upload image client
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: dtshim-image-${{ matrix.image-arch }}
          path: image/
          if-no-files-found: error

  release:
    name: Publish release archives
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          pattern: dtshim-*.tar.gz
          path: dist/
          merge-multiple: true

      - name: Publish archives to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar.gz --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi

  publish:
    name: Publish multiarch client image
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Download image clients
        uses: actions/download-artifact@v8
        with:
          pattern: dtshim-image-*
          path: image/
          merge-multiple: true

      - name: Set image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish client image
        uses: docker/build-push-action@v7
        with:
          context: image/
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
